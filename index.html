<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0d">
<title>StageCase – Musical Director for Ableton Live</title>
<meta name="description" content="StageCase – the musical director for Ableton Live: loopers, clips, setlist, lead sheet, mixer and audio interface in one app, on the Mac and on every tablet. From the rehearsal room to the stage.">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* StageCase-Homepage (stagecase.app). Systemschrift, keine externen Dateien.
     Aufbau wie die Startseite der App: Schriftzug mit Case-Ecken, darunter die Seiten als Kacheln. Klick auf eine
     Kachel oeffnet die "Buehne": links ein animierter Bildschirm (gezeichnet, kein Video), rechts die Kapitel. */
  :root { color-scheme: dark; --bg: #0b0b0d; --card: #17171b; --cell: #1d1d22; --line: #2c2c32; --fg: #f2f2f2; --dim: #a6a6ae; --faint: #6b6b74;
    --play: #34c759; --rec: #ff3b30; --dub: #0a84ff; --warn: #ffd60a; --or: #ff9f0a; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
  body { font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; font-size: 14px; color: var(--dim); }
  .head a { text-decoration: none; color: var(--dim); } .head a:hover { color: var(--fg); }
  .lang button { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 6px; padding: 3px 8px; font: 600 12px inherit; cursor: pointer; }
  .lang button.on { color: var(--fg); border-color: var(--faint); }

  /* ---------- Kopf: Schriftzug ---------- */
  .hero { text-align: center; padding: 6vh 0 2vh; }
  .wm { width: min(78vw, 640px); height: auto; display: block; margin: 0 auto; overflow: visible; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .wm .mark { opacity: 0; animation: in .5s cubic-bezier(.2,.8,.2,1) .1s forwards; transform-origin: 196px 55px; }
  .wm .corners { opacity: 0; animation: flash 3s ease-out .3s forwards; }
  @keyframes in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes flash { 0% { opacity: 0; filter: none; } 10%, 36%, 62% { opacity: 1; filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px #fff); }
    23%, 49% { opacity: .35; filter: none; } 100% { opacity: 1; filter: none; } }
  .claim { font-size: clamp(20px, 2.6vw, 30px); font-weight: 700; margin: 26px auto 8px; max-width: 760px; letter-spacing: -.01em; }
  .sub { color: var(--dim); max-width: 720px; margin: 0 auto; font-size: 17px; }
  .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 26px 0 0; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 11px; font-weight: 700; text-decoration: none;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  .btn.main { background: var(--fg); color: #0b0b0d; border-color: transparent; }
  .btn:hover { border-color: var(--faint); }
  .badge { display: inline-block; margin-top: 18px; font-size: 12px; letter-spacing: .14em; color: var(--faint); }

  /* ---------- Kacheln ---------- */
  h2 { font-size: clamp(22px, 2.4vw, 30px); margin: 0 0 6px; letter-spacing: -.01em; }
  .sect { padding: 7vh 0 2vh; }
  .sect > p.lead { color: var(--dim); margin: 0 0 24px; max-width: 760px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 960px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .tiles { grid-template-columns: 1fr; } }
  .tile { position: relative; display: flex; flex-direction: column; gap: 8px; min-height: 160px; padding: 20px 20px 38px; border-radius: 16px; cursor: pointer;
    text-align: left; color: var(--fg); font: inherit; border: 1px solid var(--line); box-shadow: inset 0 3px 0 var(--c);
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 16%, var(--card)), var(--card) 70%);
    opacity: 0; transform: translate(var(--fx), var(--fy)) rotate(var(--fr)) scale(.85);
    transition: opacity .35s ease, transform .75s cubic-bezier(.18,.95,.3,1.12), border-color .2s; }
  .tiles.in .tile { opacity: 1; transform: none; }
  .tile:hover, .tile:focus-visible { border-color: var(--c); outline: none; }
  .tile .ic { font-size: 30px; line-height: 1; } .tile b { font-size: 19px; } .tile span { color: var(--dim); font-size: 13.5px; line-height: 1.45; }
  .tile .go { position: absolute; right: 16px; bottom: 14px; font-size: 12px; font-weight: 700; color: var(--c); opacity: .8; }
  .tile.soon { border-style: dashed; cursor: default; } .tile.soon:hover { border-color: var(--line); }
  .tile .soonb { font-style: normal; letter-spacing: .06em; text-transform: uppercase; border: 1px dashed var(--c); border-radius: 6px; padding: 2px 6px; opacity: 1; }
  @media (min-width: 1100px) { .tiles { grid-template-columns: repeat(5, 1fr); } }

  /* ---------- Buehne (Overlay) ---------- */
  .stage { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 3vh 3vw; background: rgba(5,5,7,.78);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .stage.open { opacity: 1; pointer-events: auto; }
  .sbox { position: relative; width: min(1180px, 100%); max-height: 94vh; overflow: auto; display: grid; grid-template-columns: 1.35fr 1fr; gap: 26px;
    padding: 26px; border-radius: 20px; background: #121215; border: 1px solid var(--line); box-shadow: 0 30px 80px #000a, inset 0 3px 0 var(--c);
    transform: translateY(24px) scale(.97); transition: transform .4s cubic-bezier(.2,.8,.2,1); }
  .stage.open .sbox { transform: none; }
  @media (max-width: 900px) { .sbox { grid-template-columns: 1fr; } }
  /* Handy/schmal: der Bildschirm bleibt oben stehen, die Kapitel laufen darunter durch (aktives rollt mit) */
  @media (max-width: 900px) {
    .sbox { padding: 16px; gap: 12px; max-height: 96vh; }
    .scrwrap { position: sticky; top: -16px; z-index: 3; margin: -16px -16px 0; padding: 16px 16px 10px; background: #121215;
      box-shadow: 0 10px 14px -10px #000c; }
    .ttl h3 { font-size: 22px; } .one { margin-bottom: 12px; }
  }
  /* Handy: Bildschirm im Hochformat, ganz sichtbar. Die Masse (cqw) beziehen sich auf .scrcam, die 1,8-mal so breit ist
     wie der Bildschirm -- so bleibt die Schrift lesbar, und die Szenen ordnen sich untereinander an. */
  .scrcam { position: relative; }
  @media (max-width: 600px) {
    .scrwrap { overflow: hidden; }
    .scrcam { width: 180%; container-type: inline-size; }
    .scrcam .screen { width: 55.56%; aspect-ratio: 3 / 4; container-type: normal; border-width: 5px; }
    .scrcam .screen .cap { display: none; }
  }
  .close { position: absolute; top: 12px; right: 14px; border: 0; background: none; color: var(--dim); font-size: 22px; cursor: pointer; z-index: 2; }
  .close:hover { color: var(--fg); }
  .ttl { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; } .ttl .ic { font-size: 28px; } .ttl h3 { margin: 0; font-size: 26px; }
  .one { color: var(--dim); margin: 0 0 18px; }
  .chap { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .chap li { position: relative; padding: 12px 14px 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; overflow: hidden; }
  .chap li b { display: block; font-size: 15px; } .chap li span { display: block; color: var(--dim); font-size: 13.5px; margin-top: 2px; }
  .chap li.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--card)); }
  .chap li .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--c); }
  .chap li.on .bar { animation: bar var(--dur, 4.2s) linear forwards; }
  .paused .chap li.on .bar { animation-play-state: paused; }
  @keyframes bar { to { width: 100%; } }
  .nav { display: flex; gap: 8px; margin-top: 14px; align-items: center; color: var(--faint); font-size: 12px; }
  /* alle Bereiche oben im Rundgang: direkt hin- und herspringen */
  .pages { grid-column: 1 / -1; display: flex; gap: 6px; overflow-x: auto; padding: 0 30px 4px 0; margin-bottom: -6px; scrollbar-width: none; }
  .pages::-webkit-scrollbar { display: none; }
  .pages button { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line);
    background: var(--card); color: var(--dim); font: 600 13px inherit; cursor: pointer; white-space: nowrap; transition: all .2s; }
  .pages button .pi { font-size: 15px; line-height: 1; }
  .pages button:hover { color: var(--fg); border-color: var(--pc); }
  .pages button.on { color: #0b0b0d; background: var(--pc); border-color: var(--pc); }
  .pgnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; }
  .pgnav button { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: 700 13px inherit; cursor: pointer; }
  .pgnav button:hover { border-color: var(--c); }
  .pgnav #pgNext { text-align: right; padding-right: 14px; } .pgnav #pgPrev { text-align: left; padding-left: 14px; }
  .nav button { height: 34px; min-width: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; font-weight: 700; }
  .nav .sp { flex: 1; }

  /* Bildschirm (MacBook-artig) */
  .screen { position: relative; aspect-ratio: 16 / 10; border-radius: 14px; background: #0b0b0d; border: 8px solid #222226; box-shadow: 0 0 0 1px #3a3a40, 0 20px 50px #0008;
    overflow: hidden; container-type: inline-size; }
  .screen .tb { position: absolute; left: 0; right: 0; top: 0; height: 7%; display: flex; align-items: center; gap: 2.4cqw; padding: 0 2.4cqw; font-size: 1.7cqw;
    color: #8a8a92; border-bottom: 1px solid #1f1f24; background: #101013; }
  .screen .tb b { color: #f2f2f2; } .screen .tb i { width: 2.2cqw; height: 2.2cqw; border-radius: 50%; display: inline-block; background: conic-gradient(var(--play) 0 75%, #2a2a30 0); }
  .screen .tb .sp { flex: 1; } .screen .tb .live { display: inline-flex; align-items: center; gap: .8cqw; } .screen .tb .live::before { content: ""; width: 1.2cqw; height: 1.2cqw; border-radius: 50%; background: var(--play); }
  .scn { position: absolute; inset: 7% 0 0 0; padding: 3cqw; font-size: 1.8cqw; color: #d8d8de; }
  .cap { position: absolute; left: 3cqw; bottom: 2.6cqw; right: 3cqw; font-size: 2.1cqw; font-weight: 700; color: #fff; text-shadow: 0 2px 8px #000;
    opacity: 0; transform: translateY(6px); transition: opacity .4s, transform .4s; pointer-events: none; }
  .screen .cap.show { opacity: 1; transform: none; }
  .tap { position: absolute; width: 5cqw; height: 5cqw; margin: -2.5cqw 0 0 -2.5cqw; border-radius: 50%; border: .5cqw solid #fff; opacity: 0; pointer-events: none; }
  .tap.go { animation: tap .9s ease-out; }
  @keyframes tap { 0% { opacity: .9; transform: scale(.4); } 100% { opacity: 0; transform: scale(1.6); } }

  /* --- Szene Looper --- */
  .lp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2cqw; margin-top: 2cqw; }
  .ring { position: relative; aspect-ratio: 1; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .bg { fill: none; stroke: #23232a; stroke-width: 9; }
  .ring .pr { fill: none; stroke-width: 9; stroke-linecap: round; stroke-dasharray: 251; stroke-dashoffset: 251; transition: stroke .3s; }
  .ring .in { fill: #15151a; }
  .ring .lb { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 800; font-size: 2.2cqw; color: #fff; }
  .ring .lb small { display: block; font-size: 1.3cqw; color: #9a9aa4; font-weight: 600; }
  .ring.play .pr { stroke: var(--play); animation: spin 2.4s linear infinite; } .ring.rec .pr { stroke: var(--rec); animation: spin 2.4s linear infinite; }
  .ring.dub .pr { stroke: var(--dub); animation: spin 2.4s linear infinite; } .ring.stop .pr { stroke: #55555c; stroke-dashoffset: 0; }
  .ring.sel::after { content: ""; position: absolute; inset: -6%; border-radius: 50%; border: .5cqw solid var(--warn); }
  @keyframes spin { to { stroke-dashoffset: 0; } }
  .lp .ring { transition: opacity .8s; } .faded .lp .ring { opacity: .25; }
  .ctrl { position: absolute; right: 3cqw; bottom: 9cqw; display: flex; gap: 1cqw; opacity: 0; transition: opacity .4s; }
  .ctrl.show { opacity: 1; } .ctrl i { width: 6cqw; height: 4cqw; border-radius: .8cqw; background: #2a2a30; border: 1px solid #3a3a40; }
  .ctrl i.hot { background: var(--rec); box-shadow: 0 0 2cqw var(--rec); }
  .clipcard { position: absolute; left: 30%; top: 40%; width: 18cqw; padding: 1.2cqw; border-radius: 1cqw; background: var(--play); color: #0b0b0d; font-weight: 800;
    font-size: 1.6cqw; opacity: 0; transform: translate(0, 0) scale(.8); }
  .clipcard.go { animation: clip 2.6s ease-in-out forwards; }
  @keyframes clip { 0% { opacity: 0; transform: scale(.6); } 20% { opacity: 1; transform: scale(1); } 70% { opacity: 1; transform: translate(40cqw, 12cqw) scale(.6); } 100% { opacity: 0; transform: translate(40cqw, 12cqw) scale(.6); } }

  /* --- Szene Clips --- */
  .grid { display: grid; grid-template-columns: 9cqw repeat(7, 1fr); gap: .8cqw; }
  .grid .h { font-size: 1.4cqw; color: #9a9aa4; text-align: center; padding: .4cqw 0; border-radius: .6cqw; transition: box-shadow .4s; }
  .grid .sc { font-size: 1.4cqw; color: #d8d8de; background: #1b1b20; border-radius: .6cqw; padding: .6cqw; white-space: nowrap; overflow: hidden; display: flex; gap: .6cqw; align-items: center; }
  .grid .sc em { font-style: normal; font-size: 1.1cqw; color: var(--warn); background: #ffd60a22; border-radius: .4cqw; padding: 0 .5cqw; opacity: 0; transition: opacity .4s; }
  .tempo .grid .sc em { opacity: 1; }
  .grid .c { height: 4.6cqw; border-radius: .6cqw; background: #1b1b20; transition: background .3s, box-shadow .3s; }
  .grid .c.f { background: #3a3f55; } .grid .c.p { background: var(--play); box-shadow: 0 0 1.4cqw #34c75988; } .grid .c.r { background: var(--rec); box-shadow: 0 0 1.4cqw #ff3b3088; animation: blink .6s infinite alternate; }
  @keyframes blink { to { opacity: .55; } }
  .range .grid .h.in { box-shadow: inset 0 -.4cqw 0 var(--warn); color: #fff; }
  .mc6 { position: absolute; right: 3cqw; bottom: 8cqw; display: grid; grid-template-columns: repeat(3, 5.4cqw); gap: 1cqw; padding: 1.2cqw; border-radius: 1.2cqw; background: #18181c; border: 1px solid #333;
    opacity: 0; transform: translateY(2cqw); transition: opacity .4s, transform .4s; }
  .foot .mc6 { opacity: 1; transform: none; }
  .mc6 i { aspect-ratio: 1; border-radius: 50%; background: #2c2c33; border: .3cqw solid #444; display: grid; place-items: center; font-style: normal; font-size: 1.4cqw; font-weight: 800; color: #aaa; }
  .mc6 i.hot { background: #ffd60a; color: #000; box-shadow: 0 0 2cqw #ffd60a; }

  /* --- Szene Songs --- */
  .songs { display: grid; grid-template-columns: 34% 1fr; gap: 2.4cqw; height: 100%; }
  .sl { display: flex; flex-direction: column; gap: .8cqw; }
  .sl div { padding: 1cqw 1.4cqw; border-radius: .8cqw; background: #1b1b20; display: flex; justify-content: space-between; font-size: 1.6cqw; transition: all .4s; border-left: .5cqw solid var(--sc, #444); }
  .sl div.cur { box-shadow: 0 0 0 .3cqw var(--warn); } .sl small { color: #9a9aa4; }
  .cs { display: flex; flex-direction: column; gap: 1.4cqw; }
  .cs .tt { font-size: 3cqw; font-weight: 800; } .cs .tt small { font-size: 1.6cqw; color: #9a9aa4; font-weight: 600; margin-left: 1cqw; }
  .prog { height: 1cqw; border-radius: 1cqw; background: #222; overflow: hidden; } .prog i { display: block; height: 100%; width: 10%; background: var(--or); transition: width 3.8s linear; }
  .secs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1cqw; }
  .secs div { height: 7cqw; border-radius: 1cqw; background: color-mix(in srgb, var(--sc) 25%, #1b1b20); border-top: .5cqw solid var(--sc); display: grid; place-items: center; font-weight: 800; font-size: 1.8cqw; transition: box-shadow .3s; position: relative; }
  .secs div.cur { box-shadow: 0 0 0 .35cqw #fff; } .secs div.loop::after { content: "⟳ 4×"; position: absolute; right: .8cqw; top: .6cqw; font-size: 1.2cqw; color: var(--warn); }
  .stopb { align-self: flex-start; font-size: 1.5cqw; padding: .6cqw 1.2cqw; border-radius: .8cqw; border: 1px solid #444; color: #aaa; transition: all .3s; }
  .stopb.on { background: var(--rec); color: #fff; border-color: transparent; }
  .bpm { font-size: 1.8cqw; color: var(--warn); font-weight: 800; transition: transform .3s; } .bpm.pop { transform: scale(1.3); }

  .songs { position: relative; }
  .slw { display: flex; flex-direction: column; gap: .8cqw; }
  .sl .ck { font-style: normal; color: var(--play); margin-right: .7cqw; font-weight: 800; transition: color .3s; }
  .sl div.off { opacity: .35; } .sl div.off .ck { color: #555; } .sl div.off span { text-decoration: line-through; }
  .sl div.drag { transform: translateX(1.6cqw); box-shadow: 0 1cqw 2cqw #000c; }
  .add { align-self: flex-start; font-size: 1.4cqw; font-weight: 800; padding: .5cqw 1.2cqw; border-radius: .7cqw; border: 1px dashed #555; color: #aaa; transition: all .3s; }
  .add.hot { border-color: var(--or); color: var(--or); box-shadow: 0 0 0 .3cqw #ff9f0a44; }
  .btns { display: flex; gap: 1cqw; }
  .pracb { font-size: 1.5cqw; padding: .6cqw 1.2cqw; border-radius: .8cqw; border: 1px solid #444; color: #aaa; transition: all .3s; }
  .prac .pracb { background: var(--warn); color: #000; border-color: transparent; font-weight: 800; }
  .startb { font-size: 1.5cqw; padding: .6cqw 1.2cqw; border-radius: .8cqw; background: #222; color: #777; display: none; } .prac .startb { display: block; } .startb.go { background: var(--play); color: #000; font-weight: 800; }
  .secs { position: relative; transition: margin-top .4s; } .prac .secs { margin-top: 2.6cqw; }
  .pk { position: absolute; left: calc(33.33% + .35cqw); right: 0; top: -2.2cqw; height: 1.7cqw; border: .3cqw solid var(--warn); border-bottom: 0; border-radius: .6cqw .6cqw 0 0; opacity: 0; transition: opacity .4s; font-size: 1.15cqw; font-weight: 800; color: var(--warn); }
  .pk b { position: absolute; left: .6cqw; top: -2cqw; white-space: nowrap; } .pk em { position: absolute; right: .6cqw; top: -2cqw; font-style: normal; }
  .prac .pk { opacity: 1; }
  .ed { position: absolute; inset: 0; background: #111114; border-radius: 1cqw; display: flex; flex-direction: column; gap: 1cqw; opacity: 0; transform: scale(.97); pointer-events: none; transition: opacity .5s, transform .5s; }
  .edit .ed { opacity: 1; transform: none; }
  .edh { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 1.7cqw; padding: .4cqw .2cqw .8cqw; border-bottom: .25cqw solid var(--warn); }
  .edh span { color: #9a9aa4; letter-spacing: .5cqw; font-size: 1.5cqw; }
  .edw { position: relative; display: flex; flex-direction: column; gap: .7cqw; }
  .edr { display: grid; grid-template-columns: 11cqw 1fr; align-items: center; gap: 1cqw; }
  .edr > b { font-size: 1.15cqw; color: #9a9aa4; text-transform: uppercase; letter-spacing: .08em; }
  .lane { position: relative; height: 3.4cqw; background: #1a1a1f; border-radius: .6cqw; display: flex; gap: .25cqw; overflow: hidden; }
  .lane.sx i { font-style: normal; flex-basis: 0; display: grid; place-items: center; font-size: 1.3cqw; font-weight: 800; background: color-mix(in srgb, var(--sc) 30%, #1b1b20); border-top: .4cqw solid var(--sc); transition: flex-grow .9s cubic-bezier(.3,.8,.3,1), box-shadow .3s; }
  .lane.sx i.grab { box-shadow: inset -.45cqw 0 0 var(--warn); }
  .lane.cd i { flex: 1; font-style: normal; display: grid; place-items: center; color: #7fa8ff; font-weight: 800; font-size: 1.3cqw; border-right: 1px solid #2a2a30; }
  .lane .m { position: absolute; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 1.15cqw; font-weight: 700; white-space: nowrap; padding: .2cqw .6cqw; border-radius: .4cqw; background: #26262c; }
  .lane .m.t { background: none; color: #c8c8d0; }
  .lane .m.dot { width: 1.6cqw; height: 1.6cqw; padding: 0; border-radius: 50%; background: var(--q); box-shadow: 0 0 1cqw var(--q); }

  .lk { display: grid; grid-template-columns: 38% 1fr; gap: 2.4cqw; height: 100%; padding-bottom: 6cqw; }

    background: color-mix(in srgb, var(--q) 20%, #1b1b1f); box-shadow: inset .45cqw 0 0 var(--q); transition: all .3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cues i.on { background: var(--q); color: #0b0b0d; box-shadow: 0 0 0 .25cqw #fff, 0 0 2cqw color-mix(in srgb, var(--q) 70%, transparent); }

  .knobs { display: flex; gap: 1.4cqw; align-items: center; } .knobs i { width: 4.4cqw; height: 4.4cqw; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6b6b74, #26262c); border: .2cqw solid #111; }

  .kits i small { font-size: 1.1cqw; color: #6d6d75; font-family: ui-monospace, Menlo, monospace; } .kits i em { margin-left: auto; font-style: normal; color: #6d6d75; }
  .kits i em.fav { color: var(--warn); }
  .kits i.on { background: #ff6482; color: #0b0b0d; border-color: #ff6482; } .kits i.on small, .kits i.on em { color: #0b0b0d; }
  .dsong { display: grid; grid-template-columns: repeat(5, 1fr); gap: .7cqw; margin-top: auto; }

  .dtitle { font-size: 1.3cqw; font-weight: 800; color: #8a8a92; }

  /* --- Szene Mixer --- */

  /* --- Szene Monitor-Mixer --- */
  .mon { display: grid; grid-template-columns: 46% 1fr; gap: 2.4cqw; height: 100%; padding-bottom: 5cqw; }

  .desk { display: flex; flex-direction: column; gap: 1.2cqw; }

  .mtx i.hot { box-shadow: 0 0 0 .25cqw var(--or); } .mtx i.hot b { background: var(--or); }

  /* --- Szene Soundkarte --- */

  /* --- Szene MIDI --- */
  .mm { display: flex; flex-direction: column; gap: 3cqw; }
  .keys { display: flex; gap: 1.2cqw; flex-wrap: wrap; }
  .keys i { position: relative; font-style: normal; font-size: 1.6cqw; font-weight: 800; padding: 1cqw 1.8cqw; border-radius: 1cqw; background: #1d1d22; border: 1px solid #3a3a40; transition: all .3s; }
  .keys i.wait { border-color: var(--warn); box-shadow: 0 0 0 .3cqw #ffd60a55; animation: blink .5s infinite alternate; }
  .keys i .tag { position: absolute; left: 50%; top: -2.6cqw; transform: translateX(-50%); font-size: 1.1cqw; white-space: nowrap; color: #000; background: var(--play); border-radius: .5cqw; padding: .2cqw .6cqw; opacity: 0; transition: opacity .3s; }

  .dev { display: flex; align-items: center; gap: 2cqw; font-size: 1.5cqw; }
  .dev .k { display: flex; gap: .6cqw; padding: 1cqw; background: #18181c; border-radius: 1cqw; border: 1px solid #333; }
  .dev .k i { width: 3.4cqw; height: 6cqw; border-radius: .5cqw; background: #e8e8ec; } .dev .k i.hot { background: var(--warn); box-shadow: 0 0 2cqw var(--warn); }
  .hub { display: flex; align-items: center; gap: 1.4cqw; font-size: 1.5cqw; opacity: .35; transition: opacity .4s; } .port .hub { opacity: 1; }
  .hub span { padding: .8cqw 1.2cqw; border-radius: .8cqw; background: #1d1d22; border: 1px solid #3a3a40; } .hub b { color: var(--or); } .hub .ar { color: #9a9aa4; border: 0; background: none; }

  /* --- Szene Hilfe --- */
  .hp { display: flex; flex-direction: column; gap: 2cqw; }
  .search { font-size: 2cqw; padding: 1.2cqw 1.8cqw; border-radius: 1.2cqw; background: #1d1d22; border: 1px solid #3a3a40; min-height: 4.6cqw; }
  .search::after { content: "|"; animation: blink .5s infinite alternate; color: var(--warn); }
  .res { display: flex; flex-direction: column; gap: 1cqw; } .res div { padding: 1cqw 1.6cqw; border-radius: 1cqw; background: #16161a; font-size: 1.6cqw; opacity: 0; transform: translateY(1cqw); transition: all .3s; }
  .res div.show { opacity: 1; transform: none; } .res div b { color: var(--warn); } .res div.hit { box-shadow: 0 0 0 .3cqw var(--warn); }
  .tabkey { align-self: flex-start; font-size: 1.8cqw; font-weight: 800; padding: 1cqw 2.4cqw; border-radius: 1cqw; background: #e8e8ec; color: #111; box-shadow: 0 .6cqw 0 #999; opacity: 0; transition: all .3s; }

  /* ---------- Weitere Abschnitte ---------- */

    clearT(); cur = i; step = s;
    const stage = $('stage'); stage.style.setProperty('--c', p.c); stage.querySelector('.sbox').style.setProperty('--c', p.c);
    $('sIc').innerHTML = p.ic; $('sTitle').innerHTML = esc(L(p.t)) + (p.badge ? ` <em class="prev">${esc(L(TX[p.badge]))}</em>` : ''); $('sOne').textContent = L(p.one);
    $('tbNav').innerHTML = P.slice(0, 6).map((x) => (x.id === p.id ? `<b>${esc(L(x.t))}</b>` : esc(L(x.t)))).join(' · ');
    $('chap').innerHTML = p.ch.map((c, k) => `<li data-k="${k}"${k === s ? ' class="on"' : ''} style="--dur:${DUR}ms"><b>${esc(de ? c[1] : c[0])}</b><span>${esc(de ? c[3] : c[2])}</span><i class="bar"></i></li>`).join('');
    const scn = $('scn'); if (first || !scn.firstChild) { scn.className = 'scn'; scn.innerHTML = SC[p.id].html(); }
    const cap = $('cap'); cap.classList.remove('show'); cap.textContent = de ? p.ch[s][1] : p.ch[s][0]; later(60, () => cap.classList.add('show'));
    SC[p.id].step(s);
    // schmal: aktives Kapitel unter den stehenden Bildschirm rollen
    if (matchMedia('(max-width: 900px)').matches) {
      const box = stage.querySelector('.sbox'), li = $('chap').children[s], top = $('scrwrap').offsetHeight;
      if (li) { const y = li.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - top - 6;
        if (s === 0 && first) box.scrollTop = 0; else box.scrollTo({ top: Math.max(0, y), behavior: 'smooth' }); }
    }
    $('play').textContent = auto ? '❚❚' : '▶'; $('stage').classList.toggle('paused', !auto);
    // Bereiche oben und Weiter/Zurueck zum naechsten Bereich
    $('pages').innerHTML = P.map((x, k) => `<button type="button" data-p="${k}" class="${k === i ? 'on' : ''}" style="--pc:${x.c}"><span class="pi">${x.ic}</span>${esc(L(x.t))}</button>`).join('');
    const pb = $('pages').querySelector('.on'); if (pb && first) pb.scrollIntoView({ block: 'nearest', inline: 'center' });
    const pv = P[(i + P.length - 1) % P.length], nx = P[(i + 1) % P.length];
    $('pgPrev').innerHTML = `‹ ${esc(L(pv.t))}`; $('pgNext').innerHTML = `${esc(L(nx.t))} ›`;
    // automatisch: nur die Kapitel dieses Bereichs im Kreis -- in den naechsten Bereich wechselt der Besucher selbst
    if (auto) adv = setTimeout(() => show(i, (step + 1) % p.ch.length, true), DUR);
  }
  const fwd = () => (step + 1 < P[cur].ch.length ? show(cur, step + 1, true) : show((cur + 1) % P.length, 0, false));
  const back = () => (step > 0 ? show(cur, step - 1, true) : (() => { const k = (cur + P.length - 1) % P.length; show(k, P[k].ch.length - 1, false); })());
  function openStage(i) {
    auto = true; $('stage').classList.add('open'); $('stage').setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden';
    show(i, 0, false);
  }
  function closeStage() { clearT(); cur = -1; $('stage').classList.remove('open'); $('stage').setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }
  $('tiles').addEventListener('click', (e) => { const t = e.target.closest('.tile[data-i]'); if (t) openStage(Number(t.dataset.i)); });
  $('chap').addEventListener('click', (e) => { const li = e.target.closest('li'); if (li) show(cur, Number(li.dataset.k), true); });
  $('close').addEventListener('click', closeStage);
  $('stage').addEventListener('click', (e) => { if (e.target === $('stage')) closeStage(); });
  $('prev').addEventListener('click', back);
  $('next').addEventListener('click', fwd);
  $('pgPrev').addEventListener('click', () => show((cur + P.length - 1) % P.length, 0, false));
  $('pgNext').addEventListener('click', () => show((cur + 1) % P.length, 0, false));
  $('pages').addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if (b) show(Number(b.dataset.p), 0, false); });
  // „Rundgang starten“: gleich beim ersten Bereich los
  document.querySelector('[data-t="cta1"]').addEventListener('click', (e) => { e.preventDefault(); openStage(0); });
  $('play').addEventListener('click', () => { auto = !auto; show(cur, step, true); });
  addEventListener('keydown', (e) => {
    if (cur < 0) { const n = Number(e.key); if (n >= 1 && n <= P.length) openStage(n - 1); return; }
    if (e.key === 'Escape') closeStage();
    else if (e.key === 'ArrowRight') $('next').click();
    else if (e.key === 'ArrowLeft') $('prev').click();
    else if (e.key === 'Tab') { e.preventDefault(); show((cur + (e.shiftKey ? P.length - 1 : 1)) % P.length, 0, false); }
  });
  // ---------------------------------------------------------------- Klick aufs Logo: Einblenden und Ecken-Blitzen wiederholen
  document.querySelector('.wm').addEventListener('click', () => {
    for (const el of document.querySelectorAll('.wm .mark, .wm .corners')) { el.style.animation = 'none'; void el.getBoundingClientRect(); el.style.animation = ''; }
  });
  // ---------------------------------------------------------------- Einflug beim Scrollen
  let shownTiles = false;
  texts();
  const io = new IntersectionObserver((es) => { for (const en of es) if (en.isIntersecting) {
    if (en.target.id === 'tiles') { shownTiles = true; en.target.classList.add('in'); for (const t of en.target.children) t.addEventListener('transitionend', () => { t.style.transitionDelay = '0s'; }, { once: true }); }
    else en.target.classList.add('in');
    io.unobserve(en.target); } }, { threshold: .15 });
  io.observe($('tiles')); document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
  if (location.hash && location.hash.length > 1) { const i = P.findIndex((p) => p.id === location.hash.slice(1)); if (i >= 0) setTimeout(() => openStage(i), 600); }
})();
</script>
</body>
</html>
